# kit-guard: CI backstop for the local git guard. Generic rules only: secrets (gitleaks),
# files that must never be tracked, and local absolute paths. No personal values belong here.
name: kit-guard

on: [push, pull_request]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        env:
          GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSLf -o gitleaks.tar.gz "$GITLEAKS_URL"
          echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1

      - name: kit privacy
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          bad=0
          forbidden='^(\.claude/|\.superpowers/|docs/LESSONS\.md$|docs/plans/|docs/superpowers/plans/|docs/decisions/)|(^|/)(PROJECT\.toml|CLAUDE\.local\.md)$|\.local\.toml$'
          if git ls-files | grep -E "$forbidden"; then
            echo "::error::local-only files are tracked (see the list above)"; bad=1
          fi
          # kit.toml [privacy] allow_paths: the only exception route for error-level rules, like the
          # local guard ('kit-privacy: allow' on a line covers warnings only)
          envallow=()
          if [ -f kit.toml ]; then
            mapfile -t envallow < <(python3 -c 'import tomllib; print("\n".join(tomllib.load(open("kit.toml", "rb")).get("privacy", {}).get("allow_paths", [])))' 2>/dev/null || true)
          fi
          # .env / .env.<name> (templates ending in example|sample|template|dist|defaults are fine)
          while IFS= read -r p; do
            ok=0
            # shellcheck disable=SC2053  # allow_paths entries are globs on purpose
            for g in "${envallow[@]}"; do [[ -n "$g" && "$p" == $g ]] && ok=1; done
            if [ "$ok" = 0 ]; then echo "$p"; echo "::error::.env file tracked: $p"; bad=1; fi
          done < <(git ls-files | grep -E '(^|/)\.env(\.[^/]*)?$' | grep -vE '\.(example|sample|template|dist|defaults)$' || true)
          skip=(':!*.lock' ':!package-lock.json' ':!pnpm-lock.yaml' ':!yarn.lock' ':!Cargo.lock' ':!poetry.lock' ':!go.sum')
          for g in "${envallow[@]}"; do [ -n "$g" ] && skip+=(":!$g"); done
          if git grep -nIE '/mnt/[a-z]/Users/' -- . "${skip[@]}"; then
            echo "::error::Windows user paths found (see the list above)"; bad=1
          fi
          if git grep -nIE '/home/[a-z_][a-z0-9_-]*/' -- . "${skip[@]}" | grep -v 'kit-privacy: allow'; then
            echo "::warning::home paths found (see the list above); fine for container paths, not for personal ones"
          fi
          exit "$bad"
