    <path d="M985 280V430H820V514"/>
    <!-- on-demand docs .. Main Claude (read when triggered) -->
    <path d="M770 366V514"/>
    <!-- LESSONS .. back to kit deployment (evolution feedback) -->
    <path d="M985 830V920H230V886"/>
