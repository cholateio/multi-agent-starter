<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 970" font-family="'JetBrains Mono','Noto Sans TC',monospace">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7"
      markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1a1a1a" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="970" fill="#faf8f4"/>

  <text x="600" y="88" text-anchor="middle" font-size="28" letter-spacing="6"
