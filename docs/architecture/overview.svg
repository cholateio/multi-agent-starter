      <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
      <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
    </g>
    <text x="510" y="787" font-size="14" font-weight="600" fill="#1a1a1a">PROJECT.toml</text>
    <text x="510" y="806" font-size="11" fill="#1a1a1a" fill-opacity="0.65">機器可讀專案狀態</text>

    <!-- bin/proj -->
    <rect x="675" y="760" width="190" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
