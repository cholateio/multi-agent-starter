    <rect x="460" y="680" width="190" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <g transform="translate(473,700)" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="6" rx="8" ry="3"/>
      <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
      <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
    </g>
    <text x="510" y="707" font-size="14" font-weight="600" fill="#1a1a1a">PROJECT.toml</text>
    <text x="510" y="726" font-size="11" fill="#1a1a1a" fill-opacity="0.65">機器可讀專案狀態</text>

    <!-- bin/proj -->
    <rect x="675" y="680" width="190" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <g transform="translate(688,700)" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <line x1="2" y1="9" x2="22" y2="9"/><circle cx="5.5" cy="6.5" r="0.5"/>
      <circle cx="8" cy="6.5" r="0.5"/>
    </g>
    <text x="725" y="707" font-size="14" font-weight="600" fill="#1a1a1a">bin/proj</text>
    <text x="725" y="726" font-size="11" fill="#1a1a1a" fill-opacity="0.65">跨專案 dashboard</text>

    <!-- docs/LESSONS.md -->
    <rect x="890" y="680" width="190" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <g transform="translate(903,700)" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2h8l4 4v16H6V2z"/><path d="M14 2v4h4"/>
      <line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/>
