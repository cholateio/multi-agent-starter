    </g>
    <text x="940" y="467" font-size="14" font-weight="600" fill="#1a1a1a">Reviewer</text>
    <text x="940" y="486" font-size="11" fill="#1a1a1a" fill-opacity="0.65">codex 或 solo 自審</text>

