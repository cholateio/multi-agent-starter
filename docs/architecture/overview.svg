  <text x="600" y="108" text-anchor="middle" font-size="11" fill="#1a1a1a"
    fill-opacity="0.65">v4.10.0 — 16-project fleet</text>

  <!-- ============ zone containers ============ -->
  <g fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="5 5">
    <rect x="100" y="140" width="260" height="740" rx="16"/>
    <rect x="420" y="140" width="700" height="270" rx="16"/>
    <rect x="420" y="450" width="700" height="200" rx="16"/>
    <rect x="420" y="690" width="700" height="190" rx="16"/>
  </g>

  <!-- zone titles -->
  <g fill="#1a1a1a">
    <text x="124" y="166" font-size="16" letter-spacing="3">KIT DEPLOYMENT</text>
    <text x="124" y="184" font-size="12">安裝層</text>
    <line x1="124" y1="192" x2="174" y2="192" stroke="#1a1a1a" stroke-width="1.2"/>

    <text x="444" y="166" font-size="16" letter-spacing="3">HARNESS</text>
    <text x="444" y="184" font-size="12">防線層（.claude/）</text>
    <line x1="444" y1="192" x2="494" y2="192" stroke="#1a1a1a" stroke-width="1.2"/>

    <text x="444" y="476" font-size="16" letter-spacing="3">RUNTIME</text>
    <text x="444" y="494" font-size="12">執行層</text>
    <line x1="444" y1="502" x2="494" y2="502" stroke="#1a1a1a" stroke-width="1.2"/>

    <text x="444" y="716" font-size="16" letter-spacing="3">STATE / FEEDBACK</text>
    <text x="444" y="734" font-size="12">狀態與回饋層</text>
    <line x1="444" y1="742" x2="494" y2="742" stroke="#1a1a1a" stroke-width="1.2"/>
  </g>

  <!-- ============ connections ============ -->
  <g fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)">
