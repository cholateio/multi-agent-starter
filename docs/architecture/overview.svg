    <path d="M331 242H454"/>
    <!-- init.sh -> rules (top corridor) -->
    <path d="M230 204V122H770V204"/>
    <!-- hooks -> Main Claude -->
    <path d="M555 280V424H705V514"/>
    <!-- rules -> Main Claude (exits left, around the on-demand docs node) -->
    <path d="M669 242H660V436H735V514"/>
    <!-- Main Claude -> Subagents -->
    <path d="M669 552H656"/>
    <!-- Main Claude -> Reviewer -->
    <path d="M871 552H884"/>
    <!-- Main Claude -> PROJECT.toml -->
    <path d="M740 584V630H555V754"/>
    <!-- Main Claude -> LESSONS -->
    <path d="M800 584V642H985V754"/>
    <!-- templates -> PROJECT.toml -->
    <path d="M331 792H454"/>
    <!-- PROJECT.toml -> proj -->
    <path d="M656 792H669"/>
  </g>
  <g fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 4">
