<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 890" font-family="'JetBrains Mono','Noto Sans TC',monospace">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7"
      markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1a1a1a" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="890" fill="#faf8f4"/>

  <text x="600" y="88" text-anchor="middle" font-size="28" letter-spacing="6"
    fill="#1a1a1a">MULTI-AGENT STARTER KIT</text>

  <!-- ============ zone containers ============ -->
  <g fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="5 5">
    <rect x="100" y="140" width="260" height="660" rx="16"/>
    <rect x="420" y="140" width="700" height="190" rx="16"/>
    <rect x="420" y="370" width="700" height="200" rx="16"/>
    <rect x="420" y="610" width="700" height="190" rx="16"/>
  </g>

  <!-- zone titles -->
  <g fill="#1a1a1a">
    <text x="124" y="166" font-size="16" letter-spacing="3">KIT DEPLOYMENT</text>
    <text x="124" y="184" font-size="12">安裝層</text>
    <line x1="124" y1="192" x2="174" y2="192" stroke="#1a1a1a" stroke-width="1.2"/>

    <text x="444" y="166" font-size="16" letter-spacing="3">HARNESS</text>
    <text x="444" y="184" font-size="12">防線層（.claude/）</text>
    <line x1="444" y1="192" x2="494" y2="192" stroke="#1a1a1a" stroke-width="1.2"/>

    <text x="444" y="396" font-size="16" letter-spacing="3">RUNTIME</text>
    <text x="444" y="414" font-size="12">執行層</text>
    <line x1="444" y1="422" x2="494" y2="422" stroke="#1a1a1a" stroke-width="1.2"/>

    <text x="444" y="636" font-size="16" letter-spacing="3">STATE / FEEDBACK</text>
    <text x="444" y="654" font-size="12">狀態與回饋層</text>
    <line x1="444" y1="662" x2="494" y2="662" stroke="#1a1a1a" stroke-width="1.2"/>
  </g>

  <!-- ============ connections ============ -->
  <g fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)">
    <!-- init.sh -> hooks -->
    <path d="M331 242H454"/>
    <!-- init.sh -> rules (top corridor) -->
    <path d="M230 204V118H770V204"/>
    <!-- hooks -> Main Claude -->
    <path d="M555 280V350H720V434"/>
    <!-- rules -> Main Claude -->
    <path d="M770 280V434"/>
    <!-- Main Claude -> Subagents -->
    <path d="M669 472H656"/>
    <!-- Main Claude -> Reviewer -->
    <path d="M871 472H884"/>
    <!-- Main Claude -> PROJECT.toml -->
    <path d="M740 510V585H555V674"/>
    <!-- Main Claude -> LESSONS -->
    <path d="M800 510V597H985V674"/>
    <!-- templates -> PROJECT.toml -->
    <path d="M331 712H454"/>
    <!-- PROJECT.toml -> proj -->
    <path d="M656 712H669"/>
  </g>
  <g fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 4">
    <!-- skills+agents .. Main Claude (secondary) -->
    <path d="M985 280V350H820V434"/>
    <!-- LESSONS .. back to kit deployment (evolution feedback) -->
    <path d="M985 750V830H230V806"/>
  </g>

