      <line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/>
    </g>
    <text x="940" y="787" font-size="14" font-weight="600" fill="#1a1a1a">LESSONS.md</text>
    <text x="940" y="806" font-size="11" fill="#1a1a1a" fill-opacity="0.65">機隊教訓→kit 收據</text>
